<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="stilo1.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var nome = window.prompt('Qual é o seu nome?')
        document.writeln(` <h1>Seu nome tem ${nome.length} letras.</h1><br> `)
        document.writeln(`<h2>Seu nome em letras maiusculas é ${nome.toUpperCase()}</2><br>`)
        document.write(`<h3>Seu nome em letras minusculas é ${nome.toLowerCase()}</h3>`)

    </script>
</body>
</html>
